spring.application.name=estagios

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fatec_estagios?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USERNAME:fatec}
spring.datasource.password=${DB_PASSWORD:fatec123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.thymeleaf.cache=false

server.error.whitelabel.enabled=false

spring.jpa.open-in-view=false

server.servlet.session.tracking-modes=cookie
