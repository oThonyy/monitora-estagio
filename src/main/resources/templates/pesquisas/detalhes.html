<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/layout :: head('Detalhes da pesquisa')}"></head>
    <body>
        <a href="#conteudo" class="visually-hidden-focusable position-absolute bg-white p-3">Ir para o conteúdo</a>
        <aside th:replace="~{fragments/layout :: menu}"></aside>
        <div class="app-content d-flex flex-column">
            <header th:replace="~{fragments/layout :: cabecalho}"></header>
            <main class="p-3 p-md-4 p-xl-5" id="conteudo">
                <div th:replace="~{fragments/layout :: mensagens}"></div>
                <a class="text-secondary d-inline-block mb-3" th:href="@{/pesquisas}">Voltar às pesquisas</a>
                <div class="d-flex flex-wrap justify-content-between gap-3 mb-4">
                    <div>
                        <p class="text-secondary mb-1">Coleta de estágio</p>
                        <h1 class="h2" th:text="${'Pesquisa de ' + pesquisa.aluno.nome}"></h1>
                    </div>
                    <a class="btn btn-primary align-self-start" th:href="@{/pesquisas/{id}/editar(id=${pesquisa.idPesquisaEstagio})}">Editar pesquisa</a>
                </div>
                <section class="card">
                    <div class="card-header">
                        <h2 class="h5 mb-0">Respostas da coleta</h2>
                    </div>
                    <div class="card-body">
                        <dl class="row mb-0">
                            <dt class="col-sm-4 mb-2">Aluno</dt>
                            <dd class="col-sm-8" th:text="${pesquisa.aluno.nome}"></dd>
                            <dt class="col-sm-4 mb-2">Unidade</dt>
                            <dd class="col-sm-8" th:text="${pesquisa.aluno.ofertaCurso.unidadeFatec.nomeUnidade}"></dd>
                            <dt class="col-sm-4 mb-2">Curso</dt>
                            <dd class="col-sm-8" th:text="${pesquisa.aluno.ofertaCurso.curso.nomeCurso}"></dd>
                            <dt class="col-sm-4 mb-2">Data da coleta</dt>
                            <dd class="col-sm-8" th:text="${pesquisa.dataColeta == null ? 'Não informada' : #temporals.format(pesquisa.dataColeta, 'dd/MM/yyyy')}"></dd>
                            <dt class="col-sm-4 mb-2">Estágios realizados</dt>
                            <dd class="col-sm-8" th:text="${pesquisa.quantidadeEstagioRealizado}"></dd>
                            <dt class="col-sm-4 mb-2">Tempo procurando estágio</dt>
                            <dd class="col-sm-8" th:text="${pesquisa.tempoProcurandoEstagio + ' meses'}"></dd>
                            <dt class="col-sm-4 mb-2">Observações</dt>
                            <dd class="col-sm-8" th:text="${pesquisa.observacoes ?: 'Nenhuma observação informada.'}"></dd>
                        </dl>
                    </div>
                </section>
                <div class="d-flex flex-wrap gap-2 mt-4">
                    <a class="btn btn-outline-secondary" th:href="@{/alunos/{id}(id=${pesquisa.aluno.idAluno})}">Ver aluno</a>
                    <a class="btn btn-outline-secondary" th:href="@{/pesquisas(aluno=${pesquisa.aluno.idAluno})}">Histórico do aluno</a>
                    <a class="btn btn-outline-primary" th:href="@{/pesquisas/nova(aluno=${pesquisa.aluno.idAluno})}">Nova coleta</a>
                </div>
                <form class="mt-4" method="post" th:action="@{/pesquisas/{id}/excluir(id=${pesquisa.idPesquisaEstagio})}" data-confirmar="Excluir esta pesquisa? Esta ação remove somente esta coleta e não pode ser desfeita.">
                    <button class="btn btn-outline-danger" type="submit">Excluir pesquisa</button>
                </form>
            </main>
            <footer th:replace="~{fragments/layout :: rodape}"></footer>
        </div>
        <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
    </body>
</html>
